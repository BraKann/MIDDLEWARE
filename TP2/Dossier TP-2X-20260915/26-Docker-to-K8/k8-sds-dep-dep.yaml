# kubectl create -f k8-sds-dep-dep.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: daniel-sds-dep1
spec:
  selector:
    matchLabels:
      app: daniel-sds-dep1
  template:
    metadata:
      labels:
        app: daniel-sds-dep1
    spec:
      containers:
        - name: daniel-sds-dep1
          image: XXXXXX/simple-roll-dice-service:v1
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - name: nodejs-port
              containerPort: 3000
              protocol: TCP
